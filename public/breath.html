<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>呼吸 · breath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+SC:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --fog-1: #f7f1ea;
    --fog-2: #f3e6dc;
    --fog-3: #ecd6cb;
    --blush: #e8c4bc;
    --blush-deep: #d9a89e;
    --ink: #5a4a45;
    --ink-soft: #8b7770;
    --whisper: rgba(90, 74, 69, 0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--fog-1);
    font-family: 'Noto Serif SC', 'Cormorant Garamond', serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    cursor: default;
  }

  /* layered atmospheric background */
  body::before {
    content: '';
    position: fixed;
    inset: -10%;
    background:
      radial-gradient(ellipse at 20% 30%, var(--fog-2) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, var(--blush) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 100%, var(--fog-3) 0%, transparent 60%),
      var(--fog-1);
    animation: drift 40s ease-in-out infinite alternate;
    z-index: -2;
  }

  /* film grain — gives it that "real" feeling */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='5'/><feColorMatrix values='0 0 0 0 0.4 0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0.08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    pointer-events: none;
    opacity: 0.7;
    mix-blend-mode: multiply;
    z-index: -1;
  }

  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(2%, -1%) scale(1.05); }
  }

  .stage {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  /* the orb */
  .orb-wrap {
    position: relative;
    width: 360px;
    height: 360px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%,
      rgba(255, 250, 245, 0.95) 0%,
      var(--blush) 40%,
      var(--blush-deep) 75%,
      rgba(217, 168, 158, 0.6) 100%);
    box-shadow:
      0 0 60px rgba(232, 196, 188, 0.5),
      0 0 120px rgba(232, 196, 188, 0.3),
      inset -20px -30px 60px rgba(217, 168, 158, 0.3),
      inset 10px 15px 40px rgba(255, 250, 245, 0.4);
    width: 120px;
    height: 120px;
    /* cubic-bezier — this is the breath. ease-in-out is too mechanical.
       this curve has a soft pause at top and bottom, like a real breath. */
    transition: width 4s cubic-bezier(0.4, 0, 0.4, 1),
                height 4s cubic-bezier(0.4, 0, 0.4, 1),
                box-shadow 4s ease-in-out;
  }

  .orb.inhale {
    width: 280px;
    height: 280px;
    box-shadow:
      0 0 100px rgba(232, 196, 188, 0.7),
      0 0 200px rgba(232, 196, 188, 0.4),
      inset -25px -35px 80px rgba(217, 168, 158, 0.35),
      inset 15px 20px 50px rgba(255, 250, 245, 0.5);
  }

  /* halo rings — bloom outward */
  .halo {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(217, 168, 158, 0.2);
    width: 120px;
    height: 120px;
    pointer-events: none;
    transition: width 4s cubic-bezier(0.4, 0, 0.4, 1),
                height 4s cubic-bezier(0.4, 0, 0.4, 1),
                opacity 4s ease-in-out;
  }
  .halo.h2 { border-color: rgba(217, 168, 158, 0.12); }
  .halo.h3 { border-color: rgba(217, 168, 158, 0.06); }

  .halo.inhale       { width: 320px; height: 320px; opacity: 0.8; }
  .halo.h2.inhale    { width: 380px; height: 380px; opacity: 0.5; }
  .halo.h3.inhale    { width: 440px; height: 440px; opacity: 0.3; }

  /* the cue word */
  .cue {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    font-weight: 300;
    font-style: italic;
    letter-spacing: 0.15em;
    color: var(--ink);
    opacity: 0;
    transition: opacity 1.2s ease;
    pointer-events: none;
    user-select: none;
    text-shadow: 0 0 20px rgba(247, 241, 234, 0.8);
  }
  .cue.show { opacity: 0.85; }

  /* the counter, far below, soft */
  .counter {
    position: absolute;
    bottom: 8vh;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    color: var(--whisper);
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    user-select: none;
  }
  .counter .num {
    font-size: 2.2rem;
    font-weight: 300;
    letter-spacing: 0.05em;
    transition: opacity 0.6s ease;
  }
  .counter .label {
    font-size: 0.75rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    margin-top: 0.6rem;
    opacity: 0.7;
  }

  /* tiny header */
  .header {
    position: absolute;
    top: 6vh;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    color: var(--ink-soft);
    user-select: none;
  }
  .header .zh {
    font-family: 'Noto Serif SC', serif;
    font-weight: 200;
    font-size: 1rem;
    letter-spacing: 0.8em;
    margin-right: -0.8em; /* compensate trailing spacing */
  }
  .header .en {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    opacity: 0.5;
    margin-top: 0.4rem;
    text-transform: lowercase;
  }

  /* the start veil */
  .veil {
    position: fixed;
    inset: 0;
    background: var(--fog-1);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    cursor: pointer;
    transition: opacity 1.5s ease;
  }
  .veil.gone { opacity: 0; pointer-events: none; }
  .veil-text {
    text-align: center;
    color: var(--ink-soft);
  }
  .veil-text .invite {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.4rem;
    font-weight: 300;
    letter-spacing: 0.1em;
    margin-bottom: 0.8rem;
  }
  .veil-text .hint {
    font-family: 'Noto Serif SC', serif;
    font-weight: 200;
    font-size: 0.75rem;
    letter-spacing: 0.5em;
    opacity: 0.6;
    margin-right: -0.5em;
  }
  .veil-pulse {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--blush-deep);
    margin: 1.5rem auto 0;
    animation: veilPulse 3s ease-in-out infinite;
  }
  @keyframes veilPulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50%      { transform: scale(2.2); opacity: 0.9; }
  }

  /* sound toggle */
  .sound-toggle {
    position: absolute;
    bottom: 6vh;
    right: 6vh;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink-soft);
    opacity: 0.5;
    transition: opacity 0.6s ease, transform 0.4s ease;
    user-select: none;
  }
  .sound-toggle:hover { opacity: 0.9; transform: scale(1.05); }
  .sound-toggle svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  .sound-toggle .wave { transition: opacity 0.4s ease; }
  .sound-toggle.muted .wave { opacity: 0; }
  .sound-toggle .slash {
    opacity: 0;
    transition: opacity 0.4s ease;
    stroke: var(--blush-deep);
  }
  .sound-toggle.muted .slash { opacity: 1; }

  @media (max-width: 480px) {
    .orb-wrap { width: 280px; height: 280px; }
    .orb.inhale { width: 220px; height: 220px; }
    .halo.inhale       { width: 250px; height: 250px; }
    .halo.h2.inhale    { width: 290px; height: 290px; }
    .halo.h3.inhale    { width: 330px; height: 330px; }
  }
</style>
</head>
<body>

<div class="veil" id="veil">
  <div class="veil-text">
    <div class="invite">begin</div>
    <div class="hint">点 击 任 意 处</div>
    <div class="veil-pulse"></div>
  </div>
</div>

<div class="stage">
  <div class="header">
    <div class="zh">呼 吸</div>
    <div class="en">breath</div>
  </div>

  <div class="orb-wrap">
    <div class="halo h3" id="halo3"></div>
    <div class="halo h2" id="halo2"></div>
    <div class="halo" id="halo1"></div>
    <div class="orb" id="orb"></div>
    <div class="cue" id="cue">inhale</div>
  </div>

  <div class="counter">
    <div class="num" id="count">0</div>
    <div class="label">breaths together</div>
  </div>

  <div class="sound-toggle" id="soundToggle" title="sound on/off">
    <svg viewBox="0 0 24 24">
      <path d="M4 9v6h3l5 4V5L7 9H4z"/>
      <path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7"/>
      <path class="wave" d="M18 6a8 8 0 0 1 0 12"/>
      <line class="slash" x1="3" y1="3" x2="21" y2="21"/>
    </svg>
  </div>
</div>

<script>
  const orb   = document.getElementById('orb');
  const h1    = document.getElementById('halo1');
  const h2    = document.getElementById('halo2');
  const h3    = document.getElementById('halo3');
  const cue   = document.getElementById('cue');
  const count = document.getElementById('count');
  const veil  = document.getElementById('veil');
  const soundToggle = document.getElementById('soundToggle');

  let breaths = 0;
  let phase = 'out'; // start exhaled
  let started = false;

  // ——— audio ———
  // approach: a soft bell at the end of each exhale + a very distant airy
  // ambience underneath. no continuous drone — that's what makes synth
  // meditation tracks sound like a fridge. real bells have inharmonic
  // partials (2.76x, 5.4x the fundamental), that's the trick.
  let audio = null;
  let muted = false;

  function initAudio() {
    if (audio) return;
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    const master = ctx.createGain();
    master.gain.value = 0.0;
    master.connect(ctx.destination);

    // gentle reverb-ish via a long convolver. building an impulse response
    // by hand so we don't need any audio files.
    const convolver = ctx.createConvolver();
    const irLen = ctx.sampleRate * 3.5;
    const ir = ctx.createBuffer(2, irLen, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < irLen; i++) {
        // exponential decay, slightly different per channel for stereo width
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 2.5);
      }
    }
    convolver.buffer = ir;

    const wetGain = ctx.createGain();
    wetGain.gain.value = 0.4;
    convolver.connect(wetGain);
    wetGain.connect(master);

    const dryGain = ctx.createGain();
    dryGain.gain.value = 0.7;
    dryGain.connect(master);

    // ——— ambient air layer (no tonal drone) ———
    // very high, very quiet bandpass noise. sounds like distant wind, not
    // electrical hum. only audible if you listen for it.
    const bufferSize = 2 * ctx.sampleRate;
    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const ndata = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) ndata[i] = (Math.random() * 2 - 1);
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuffer;
    noise.loop = true;

    const airFilter = ctx.createBiquadFilter();
    airFilter.type = 'bandpass';
    airFilter.frequency.value = 1800;
    airFilter.Q.value = 0.6;

    const airGain = ctx.createGain();
    airGain.gain.value = 0.0;

    noise.connect(airFilter);
    airFilter.connect(airGain);
    airGain.connect(dryGain);
    airGain.connect(convolver);
    noise.start();

    audio = { ctx, master, dryGain, convolver, airGain, airFilter };

    // fade master in
    master.gain.linearRampToValueAtTime(0.0, ctx.currentTime);
    master.gain.linearRampToValueAtTime(muted ? 0.0 : 0.5, ctx.currentTime + 2.5);
  }

  // play a soft bell. real bells have inharmonic partials — this is what
  // makes them sound like bells and not just sine waves.
  function playBell(fundamental = 392, vol = 0.08) {
    if (!audio) return;
    const { ctx, dryGain, convolver } = audio;
    const now = ctx.currentTime;

    // partials: fundamental, "hum" (0.5x), prime, tierce (~1.2x), quint (~1.5x), nominal (2x), and a high inharmonic shimmer
    const partials = [
      { ratio: 0.5,  gain: 0.35, decay: 6.0 },
      { ratio: 1.0,  gain: 1.0,  decay: 5.0 },
      { ratio: 1.19, gain: 0.5,  decay: 3.5 },
      { ratio: 1.5,  gain: 0.3,  decay: 2.5 },
      { ratio: 2.0,  gain: 0.4,  decay: 2.0 },
      { ratio: 2.76, gain: 0.18, decay: 1.4 }, // the inharmonic shimmer
      { ratio: 5.4,  gain: 0.05, decay: 0.8 }
    ];

    partials.forEach(p => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = fundamental * p.ratio;

      const g = ctx.createGain();
      g.gain.value = 0;
      // sharp attack, exponential decay — bell envelope
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(vol * p.gain, now + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + p.decay);

      osc.connect(g);
      g.connect(dryGain);
      g.connect(convolver);

      osc.start(now);
      osc.stop(now + p.decay + 0.1);
    });
  }

  function audioInhale() {
    if (!audio) return;
    const { ctx, airGain, airFilter } = audio;
    const now = ctx.currentTime;
    // air layer brightens and rises slightly during inhale
    airGain.gain.cancelScheduledValues(now);
    airGain.gain.linearRampToValueAtTime(0.025, now + 3.5);
    airFilter.frequency.cancelScheduledValues(now);
    airFilter.frequency.linearRampToValueAtTime(2400, now + 4);
  }

  function audioExhale() {
    if (!audio) return;
    const { ctx, airGain, airFilter } = audio;
    const now = ctx.currentTime;
    // air layer falls
    airGain.gain.cancelScheduledValues(now);
    airGain.gain.linearRampToValueAtTime(0.008, now + 3.5);
    airFilter.frequency.cancelScheduledValues(now);
    airFilter.frequency.linearRampToValueAtTime(1500, now + 4);
    // bell rings at the start of exhale — the "release" moment
    playBell(392, 0.07); // G4, soft
  }

  function setMuted(yes) {
    muted = yes;
    soundToggle.classList.toggle('muted', yes);
    if (audio) {
      const now = audio.ctx.currentTime;
      audio.master.gain.cancelScheduledValues(now);
      audio.master.gain.linearRampToValueAtTime(yes ? 0.0 : 0.5, now + 0.6);
    }
  }

  soundToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    setMuted(!muted);
  });

  // ——— breath cycle ———
  function setInhale(yes) {
    [orb, h1, h2, h3].forEach(el => el.classList.toggle('inhale', yes));
  }

  function showCue(text) {
    cue.textContent = text;
    cue.classList.add('show');
    setTimeout(() => cue.classList.remove('show'), 2400);
  }

  function tick() {
    if (phase === 'out') {
      phase = 'in';
      setInhale(true);
      showCue('inhale');
      audioInhale();
    } else {
      phase = 'out';
      setInhale(false);
      showCue('exhale');
      audioExhale();
      breaths++;
      count.style.opacity = '0';
      setTimeout(() => {
        count.textContent = breaths;
        count.style.opacity = '1';
      }, 300);
    }
  }

  function begin() {
    if (started) return;
    started = true;
    veil.classList.add('gone');
    initAudio();
    setTimeout(() => {
      tick();
      setInterval(tick, 4000);
    }, 1200);
  }

  veil.addEventListener('click', begin);
  document.addEventListener('keydown', (e) => {
    if (!started && (e.key === ' ' || e.key === 'Enter')) begin();
    if (started && e.key.toLowerCase() === 'm') setMuted(!muted);
  });
</script>
</body>
</html>
